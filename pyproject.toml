[project]
name = "minicode"
version = "0.1.0"
description = "Agent for Coding"
authors = [
    { name = "Ashitaka-Laputa-IV", email = "Ashitaka-Laputa-IV@outlook.com" }
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "deepagents>=0.7.34",
    "langchain-deepseek>=1.1.1",
]

[project.scripts]
minicode = "minicode:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
