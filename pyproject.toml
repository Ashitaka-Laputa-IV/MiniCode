[project]
name = "minicode"
version = "0.1.0"
description = "Agent for Coding"
authors = [
    { name = "Ashitaka-Laputa-IV", email = "Ashitaka-Laputa-IV@outlook.com" }
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "deepagents>=0.7.34",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
minicode = "minicode:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live"]
markers = [
    "live: requires a model API key and network access",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "evals/tasks",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["minicode"]

[tool.coverage.report]
fail_under = 50
omit = [
    "src/minicode/__main__.py",
    "src/minicode/evals/__main__.py",
]
