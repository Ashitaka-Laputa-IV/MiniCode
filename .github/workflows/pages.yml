name: Deploy project site

# Manual deploys only. Push a `site-*` tag (for example `site-2026-11-18`)
# after the site files are merged. `workflow_dispatch` becomes available once
# this workflow exists on the repository's default branch (`main`).
on:
  workflow_dispatch:
  push:
    tags:
      - "site-*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
