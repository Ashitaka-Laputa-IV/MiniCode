name: Live tests

# Live tests call a paid model API, so this workflow is manual only.
# It is intentionally not triggered by pull requests.
on:
  workflow_dispatch:
    inputs:
      model:
        description: LangChain model as provider:model
        required: true
        default: deepseek:deepseek-flash
        type: choice
        options:
          - deepseek:deepseek-flash
          - deepseek:deepseek-v4-pro

permissions:
  contents: read

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live-tests:
    name: Live tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Require DEEPSEEK_API_KEY
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::Set the DEEPSEEK_API_KEY repository secret before running live tests."
            exit 1
          fi

      - name: Run live tests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINICODE_MODEL: ${{ inputs.model }}
        run: uv run pytest -m live -q --junitxml=live-tests.xml

      - name: Upload live test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-tests-${{ github.run_id }}
          path: live-tests.xml
          if-no-files-found: warn
          retention-days: 30
