name: Live eval

# Live evals call a paid model API, so this workflow is manual only.
# It is intentionally not triggered by pull requests.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite name under evals/suites
        required: true
        default: smoke
        type: string
      model:
        description: LangChain model as provider:model
        required: true
        default: deepseek:deepseek-flash
        type: string
      baseline:
        description: Baseline to run
        required: true
        default: full
        type: choice
        options:
          - full
          - bare
          - all
      task:
        description: Optional single task id (leave empty to run the whole suite)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Run live eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Require DEEPSEEK_API_KEY
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::Set the DEEPSEEK_API_KEY repository secret before running live evals."
            exit 1
          fi

      - name: Run eval
        shell: bash
        env:
          EVAL_SUITE: ${{ inputs.suite }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_BASELINE: ${{ inputs.baseline }}
          EVAL_TASK: ${{ inputs.task }}
        run: |
          args=(
            --suite "$EVAL_SUITE"
            --baseline "$EVAL_BASELINE"
            --model "$EVAL_MODEL"
            --json "evals/results/live-${GITHUB_RUN_ID}.json"
          )
          if [ -n "$EVAL_TASK" ]; then
            args+=(--task "$EVAL_TASK")
          fi
          uv run minicode eval "${args[@]}"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-eval-${{ github.run_id }}
          path: evals/results/*.json
          if-no-files-found: warn
          retention-days: 30
